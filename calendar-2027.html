<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 Calendar &amp; Scheduler</title>
<style>
  :root {
    --ink: #1f2937;
    --muted: #9ca3af;
    --bg: #f4f6fb;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 40px 24px;
    background: var(--bg);
    color: var(--ink);
  }

  .page-header {
    text-align: center;
    margin-bottom: 20px;
  }
  .page-header h1 {
    font-size: 72px;
    letter-spacing: 8px;
    margin: 0;
    font-weight: 800;
    background: linear-gradient(90deg,#60a5fa,#34d399,#fbbf24,#fb923c,#f472b6,#a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .page-header p {
    margin: 6px 0 0;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 13px;
  }

  /* Toolbar */
  .toolbar {
    max-width: 1200px;
    margin: 0 auto 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
  }
  .toolbar button {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border: 1px solid #d1d5db;
    background: #fff;
    color: var(--ink);
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .toolbar button:hover { background: #f3f4f6; border-color: #9ca3af; }
  .toolbar .count { font-size: 12px; color: var(--muted); margin-left: 4px; }

  .calendar-grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .month {
    --accent: #2563eb;
    --soft: #eff6ff;
    --head: #e0ecff;
    --pat: rgba(37,99,235,0.07);
    position: relative;
    background: #fff;
    border: 1px solid rgba(0,0,0,0.06);
    border-top: 5px solid var(--accent);
    border-radius: 14px;
    padding: 0 16px 16px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }

  .month::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.9;
  }
  .month > * { position: relative; z-index: 1; }

  .season-winter::before {
    background-image:
      radial-gradient(var(--pat) 1.6px, transparent 1.7px),
      radial-gradient(var(--pat) 1px, transparent 1.1px);
    background-size: 34px 34px, 22px 22px;
    background-position: 0 0, 11px 11px;
  }
  .season-spring::before {
    background-image:
      radial-gradient(circle at 30% 30%, var(--pat) 5px, transparent 6px),
      radial-gradient(circle at 70% 65%, var(--pat) 3px, transparent 4px),
      radial-gradient(var(--pat) 1px, transparent 1.2px);
    background-size: 56px 56px, 56px 56px, 18px 18px;
    background-position: 0 0, 0 0, 9px 9px;
  }
  .season-summer::before {
    background-image: repeating-linear-gradient(
      45deg, var(--pat) 0 8px, transparent 8px 22px);
  }
  .season-autumn::before {
    background-image:
      repeating-linear-gradient(60deg,  var(--pat) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(-60deg, var(--pat) 0 2px, transparent 2px 30px);
  }

  .month-head {
    margin: 0 -16px 10px;
    padding: 14px 16px 12px;
    background: linear-gradient(180deg, var(--head), #ffffff);
    text-align: center;
  }
  .month-head .icon { font-size: 26px; line-height: 1; }
  .month-head h2 {
    margin: 4px 0 2px;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--accent);
  }
  .month-head .season {
    font-size: 10.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  th {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    opacity: 0.75;
    padding: 6px 0;
    text-transform: uppercase;
  }
  td {
    text-align: center;
    vertical-align: top;
    padding: 4px 0 2px;
    font-size: 13px;
    border-radius: 8px;
    height: 40px;
  }
  th.we, td.we { color: #ef4444; }

  /* Clickable day cell */
  td.day {
    cursor: pointer;
    transition: background .15s;
    position: relative;
  }
  td.day:hover { background: var(--soft); }
  td.day .num { display: inline-block; }

  td.holiday .num {
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    border-radius: 999px;
    width: 22px; height: 22px;
    line-height: 22px;
  }
  td.holiday { cursor: pointer; }

  /* Event indicators inside a day */
  .ev-dots {
    display: flex;
    gap: 2px;
    justify-content: center;
    margin-top: 2px;
    min-height: 6px;
    flex-wrap: wrap;
  }
  .ev-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }
  td.has-events { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ev-label {
    display: block;
    font-size: 8.5px;
    line-height: 1.15;
    color: var(--ink);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    font-weight: 600;
  }

  .legend {
    max-width: 1200px;
    margin: 28px auto 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 18px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  footer {
    text-align: center;
    margin-top: 28px;
    color: var(--muted);
    font-size: 12px;
  }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(17,24,39,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff;
    width: 100%;
    max-width: 440px;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    overflow: hidden;
    animation: pop .15s ease-out;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-head {
    padding: 18px 20px;
    background: linear-gradient(90deg,#60a5fa,#a78bfa);
    color: #fff;
  }
  .modal-head h3 { margin: 0; font-size: 18px; }
  .modal-head .sub { font-size: 12.5px; opacity: .9; margin-top: 2px; }
  .modal-body { padding: 18px 20px; }

  .modal-body label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin: 12px 0 5px;
  }
  .modal-body input[type="text"],
  .modal-body input[type="time"],
  .modal-body textarea {
    width: 100%;
    font: inherit;
    font-size: 14px;
    padding: 9px 11px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
  }
  .modal-body textarea { resize: vertical; min-height: 54px; }
  .time-row { display: flex; gap: 10px; }
  .time-row > div { flex: 1; }

  .color-row { display: flex; gap: 8px; margin-top: 6px; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
  }
  .swatch.sel { border-color: #111827; transform: scale(1.1); }

  .existing-events { margin-top: 14px; }
  .existing-events h4 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); margin: 0 0 8px;
  }
  .ev-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 9px; border-radius: 8px; background: #f9fafb;
    margin-bottom: 6px; font-size: 13px;
  }
  .ev-item .bar { width: 4px; align-self: stretch; border-radius: 2px; }
  .ev-item .txt { flex: 1; min-width: 0; }
  .ev-item .txt .t { font-weight: 600; }
  .ev-item .txt .meta { font-size: 11px; color: var(--muted); }
  .ev-item button {
    border: none; background: none; cursor: pointer; font-size: 13px;
    color: #6b7280; padding: 4px;
  }
  .ev-item button:hover { color: #dc2626; }

  .modal-actions {
    display: flex; gap: 10px; justify-content: flex-end;
    padding: 14px 20px; border-top: 1px solid #f0f0f0;
  }
  .modal-actions button {
    font: inherit; font-weight: 600; font-size: 14px;
    padding: 9px 16px; border-radius: 8px; cursor: pointer; border: 1px solid transparent;
  }
  .btn-cancel { background: #fff; border-color: #d1d5db; color: var(--ink); }
  .btn-cancel:hover { background: #f3f4f6; }
  .btn-save { background: #2563eb; color: #fff; }
  .btn-save:hover { background: #1d4ed8; }

  @media (max-width: 900px) {
    .calendar-grid { grid-template-columns: repeat(2, 1fr); }
    .page-header h1 { font-size: 52px; }
  }
  @media (max-width: 600px) {
    .calendar-grid { grid-template-columns: 1fr; }
  }

  @media print {
    body { padding: 12px; background: #fff; }
    .calendar-grid { gap: 10px; max-width: 100%; }
    .month { break-inside: avoid; box-shadow: none; padding: 0 8px 8px; }
    .page-header h1 { font-size: 40px; }
    footer, .legend, .toolbar { display: none; }
    td.holiday .num, .month::before {
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
  }
</style>
</head>
<body>
  <header class="page-header">
    <h1>2027</h1>
    <p>A Year in Color &middot; Click any day to add a schedule</p>
  </header>

  <div class="toolbar">
    <button id="btn-export">⬇️ Export schedule</button>
    <button id="btn-import">⬆️ Import schedule</button>
    <button id="btn-clear">🗑️ Clear all</button>
    <span class="count" id="count"></span>
    <input type="file" id="file-input" accept="application/json" hidden>
  </div>

  <main class="calendar-grid" id="calendar"></main>

  <div class="legend" id="legend"></div>

  <footer>Click a day to add events &middot; everything saves in this browser &middot; use Export to back up or move your schedule</footer>

  <!-- Event editor modal -->
  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title">Add event</h3>
        <div class="sub" id="modal-date"></div>
      </div>
      <div class="modal-body">
        <label for="ev-title">Event</label>
        <input type="text" id="ev-title" placeholder="e.g. Dentist appointment" maxlength="80" autocomplete="off">

        <div class="time-row">
          <div>
            <label for="ev-start">Start</label>
            <input type="time" id="ev-start">
          </div>
          <div>
            <label for="ev-end">End</label>
            <input type="time" id="ev-end">
          </div>
        </div>

        <label for="ev-notes">Notes</label>
        <textarea id="ev-notes" placeholder="Optional details…" maxlength="300"></textarea>

        <label>Color</label>
        <div class="color-row" id="color-row"></div>

        <div class="existing-events" id="existing-wrap" hidden>
          <h4>Events on this day</h4>
          <div id="existing-list"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="btn-cancel">Cancel</button>
        <button class="btn-save" id="btn-save">Add event</button>
      </div>
    </div>
  </div>

<script>
  const YEAR = 2027;
  const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const STORAGE_KEY = "calendar-2027-events";

  const THEMES = [
    { name:"January",   icon:"❄️", season:"Winter",        pat:"winter", accent:"#2563eb", soft:"#e8f0ff", head:"#dbe8ff" },
    { name:"February",  icon:"💗", season:"Winter · Love", pat:"winter", accent:"#e11d8f", soft:"#ffe8f4", head:"#ffdcef" },
    { name:"March",     icon:"🍀", season:"Spring begins", pat:"spring", accent:"#16a34a", soft:"#e7f8ec", head:"#d6f3df" },
    { name:"April",     icon:"🌷", season:"Spring",        pat:"spring", accent:"#9333ea", soft:"#f4e8ff", head:"#ebd9ff" },
    { name:"May",       icon:"🌸", season:"Spring",        pat:"spring", accent:"#ec4899", soft:"#ffe9f3", head:"#ffd9eb" },
    { name:"June",      icon:"☀️", season:"Summer begins", pat:"summer", accent:"#f59e0b", soft:"#fff3da", head:"#ffedc6" },
    { name:"July",      icon:"🎆", season:"Summer",        pat:"summer", accent:"#dc2626", soft:"#ffe6e6", head:"#ffd6d6" },
    { name:"August",    icon:"🌊", season:"Summer",        pat:"summer", accent:"#0891b2", soft:"#e2f6fb", head:"#cdeff6" },
    { name:"September", icon:"🍁", season:"Autumn begins", pat:"autumn", accent:"#ea580c", soft:"#ffeede", head:"#ffe1c7" },
    { name:"October",   icon:"🎃", season:"Autumn",        pat:"autumn", accent:"#7c3aed", soft:"#efe7ff", head:"#e2d4ff" },
    { name:"November",  icon:"🦃", season:"Autumn",        pat:"autumn", accent:"#b45309", soft:"#fbefdf", head:"#f6e2c8" },
    { name:"December",  icon:"🎄", season:"Winter",        pat:"winter", accent:"#15803d", soft:"#e6f6ec", head:"#d4f0dc" },
  ];

  const EVENT_COLORS = ["#2563eb","#16a34a","#f59e0b","#dc2626","#9333ea","#0891b2"];

  function tint(hex, alpha) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return `rgba(${r},${g},${b},${alpha})`;
  }

  const HOLIDAYS = {
    "0-1":"New Year's Day","0-18":"Martin Luther King Jr. Day","1-2":"Groundhog Day",
    "1-14":"Valentine's Day","1-15":"Presidents' Day","2-17":"St. Patrick's Day",
    "2-20":"Spring Equinox","3-1":"April Fools' Day","3-22":"Earth Day",
    "3-28":"Easter Sunday","4-5":"Cinco de Mayo","4-9":"Mother's Day",
    "4-31":"Memorial Day","5-19":"Juneteenth","5-20":"Father's Day",
    "5-21":"Summer Solstice","6-4":"Independence Day","8-6":"Labor Day",
    "8-23":"Autumn Equinox","9-11":"Indigenous Peoples' / Columbus Day",
    "9-31":"Halloween","10-11":"Veterans Day","10-25":"Thanksgiving",
    "11-21":"Winter Solstice","11-25":"Christmas Day","11-31":"New Year's Eve",
  };

  /* ---------------- Data layer (localStorage) ---------------- */
  // events = { "month-day": [ {id, title, start, end, notes, color} ] }
  let events = loadEvents();

  function loadEvents() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveEvents() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); }
    catch (e) { alert("Could not save — browser storage may be full or disabled."); }
    updateCount();
  }
  function keyFor(month, day) { return month + "-" + day; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function updateCount() {
    const total = Object.values(events).reduce((n, arr) => n + arr.length, 0);
    document.getElementById("count").textContent =
      total ? `${total} event${total === 1 ? "" : "s"} scheduled` : "No events yet";
  }

  /* ---------------- Build calendar ---------------- */
  function buildMonth(month) {
    const t = THEMES[month];
    const section = document.createElement("section");
    section.className = "month season-" + t.pat;
    section.style.setProperty("--accent", t.accent);
    section.style.setProperty("--soft", t.soft);
    section.style.setProperty("--head", t.head);
    section.style.setProperty("--pat", tint(t.accent, t.pat === "summer" ? 0.06 : 0.08));

    const head = document.createElement("div");
    head.className = "month-head";
    head.innerHTML = `<div class="icon">${t.icon}</div><h2>${t.name}</h2><div class="season">${t.season}</div>`;
    section.appendChild(head);

    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const hrow = document.createElement("tr");
    DOW.forEach((d, i) => {
      const th = document.createElement("th");
      th.textContent = d;
      if (i >= 5) th.className = "we";
      hrow.appendChild(th);
    });
    thead.appendChild(hrow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    const firstDay = new Date(YEAR, month, 1).getDay();
    const offset = (firstDay + 6) % 7;
    const daysInMonth = new Date(YEAR, month + 1, 0).getDate();

    let day = 1;
    for (let week = 0; week < 6; week++) {
      const row = document.createElement("tr");
      let rowHasDay = false;
      for (let col = 0; col < 7; col++) {
        const td = document.createElement("td");
        if ((week === 0 && col < offset) || day > daysInMonth) {
          td.innerHTML = "&nbsp;";
        } else {
          const thisDay = day;
          td.className = "day";
          if (col >= 5) td.className += " we";
          const hkey = keyFor(month, thisDay);
          if (HOLIDAYS[hkey]) {
            td.className += " holiday";
            td.title = HOLIDAYS[hkey];
          }
          td.innerHTML = `<span class="num">${thisDay}</span><div class="ev-dots"></div>`;
          td.dataset.key = hkey;
          td.dataset.month = month;
          td.dataset.day = thisDay;
          td.addEventListener("click", () => openModal(month, thisDay));
          day++;
          rowHasDay = true;
        }
        row.appendChild(td);
      }
      if (rowHasDay) tbody.appendChild(row);
    }
    table.appendChild(tbody);
    section.appendChild(table);
    return section;
  }

  const container = document.getElementById("calendar");
  for (let m = 0; m < 12; m++) container.appendChild(buildMonth(m));

  /* Render event indicators for one day cell */
  function renderDay(month, day) {
    const key = keyFor(month, day);
    const td = document.querySelector(`td[data-key="${key}"]`);
    if (!td) return;
    const list = events[key] || [];
    const dots = td.querySelector(".ev-dots");
    dots.innerHTML = "";
    td.classList.toggle("has-events", list.length > 0);
    // remove any old labels
    td.querySelectorAll(".ev-label").forEach(n => n.remove());

    list.slice().sort(sortByTime).forEach((ev, i) => {
      const dot = document.createElement("span");
      dot.className = "ev-dot";
      dot.style.background = ev.color || "#2563eb";
      dots.appendChild(dot);
      if (i === 0) {
        const label = document.createElement("span");
        label.className = "ev-label";
        label.style.color = ev.color || "#2563eb";
        label.textContent = (ev.start ? ev.start + " " : "") + ev.title;
        td.appendChild(label);
      }
    });
    if (list.length > 1) {
      const more = document.createElement("span");
      more.className = "ev-label";
      more.style.color = "#9ca3af";
      more.textContent = `+${list.length - 1} more`;
      td.appendChild(more);
    }
  }

  function sortByTime(a, b) {
    return (a.start || "99:99").localeCompare(b.start || "99:99");
  }

  function renderAll() {
    for (const key in events) {
      const [m, d] = key.split("-").map(Number);
      renderDay(m, d);
    }
    updateCount();
  }

  /* ---------------- Modal ---------------- */
  const overlay = document.getElementById("overlay");
  const elTitle = document.getElementById("ev-title");
  const elStart = document.getElementById("ev-start");
  const elEnd = document.getElementById("ev-end");
  const elNotes = document.getElementById("ev-notes");
  const colorRow = document.getElementById("color-row");
  let current = { month: null, day: null, color: EVENT_COLORS[0], editingId: null };

  // build color swatches
  EVENT_COLORS.forEach(c => {
    const s = document.createElement("div");
    s.className = "swatch";
    s.style.background = c;
    s.dataset.color = c;
    s.addEventListener("click", () => selectColor(c));
    colorRow.appendChild(s);
  });
  function selectColor(c) {
    current.color = c;
    colorRow.querySelectorAll(".swatch").forEach(s =>
      s.classList.toggle("sel", s.dataset.color === c));
  }

  function fmtDate(month, day) {
    const d = new Date(YEAR, month, day);
    return d.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric", year:"numeric" });
  }

  function openModal(month, day) {
    current = { month, day, color: EVENT_COLORS[0], editingId: null };
    document.getElementById("modal-date").textContent = fmtDate(month, day);
    resetForm();
    renderExisting(month, day);
    overlay.classList.add("open");
    elTitle.focus();
  }

  function resetForm() {
    document.getElementById("modal-title").textContent = "Add event";
    document.getElementById("btn-save").textContent = "Add event";
    elTitle.value = ""; elStart.value = ""; elEnd.value = ""; elNotes.value = "";
    current.editingId = null;
    selectColor(EVENT_COLORS[0]);
  }

  function renderExisting(month, day) {
    const key = keyFor(month, day);
    const list = (events[key] || []).slice().sort(sortByTime);
    const wrap = document.getElementById("existing-wrap");
    const box = document.getElementById("existing-list");
    box.innerHTML = "";
    if (!list.length) { wrap.hidden = true; return; }
    wrap.hidden = false;
    list.forEach(ev => {
      const item = document.createElement("div");
      item.className = "ev-item";
      const time = [ev.start, ev.end].filter(Boolean).join(" – ");
      item.innerHTML =
        `<span class="bar" style="background:${ev.color}"></span>` +
        `<div class="txt"><div class="t"></div><div class="meta"></div></div>` +
        `<button title="Edit" data-act="edit">✏️</button>` +
        `<button title="Delete" data-act="del">🗑️</button>`;
      item.querySelector(".t").textContent = ev.title;
      item.querySelector(".meta").textContent = [time, ev.notes].filter(Boolean).join(" · ");
      item.querySelector('[data-act="edit"]').addEventListener("click", () => startEdit(ev));
      item.querySelector('[data-act="del"]').addEventListener("click", () => deleteEvent(ev.id));
      box.appendChild(item);
    });
  }

  function startEdit(ev) {
    current.editingId = ev.id;
    document.getElementById("modal-title").textContent = "Edit event";
    document.getElementById("btn-save").textContent = "Save changes";
    elTitle.value = ev.title || "";
    elStart.value = ev.start || "";
    elEnd.value = ev.end || "";
    elNotes.value = ev.notes || "";
    selectColor(ev.color || EVENT_COLORS[0]);
    elTitle.focus();
  }

  function saveFromForm() {
    const title = elTitle.value.trim();
    if (!title) { elTitle.focus(); elTitle.style.borderColor = "#dc2626"; return; }
    elTitle.style.borderColor = "";
    const key = keyFor(current.month, current.day);
    if (!events[key]) events[key] = [];

    if (current.editingId) {
      const ev = events[key].find(e => e.id === current.editingId);
      if (ev) {
        ev.title = title; ev.start = elStart.value; ev.end = elEnd.value;
        ev.notes = elNotes.value.trim(); ev.color = current.color;
      }
    } else {
      events[key].push({
        id: uid(), title,
        start: elStart.value, end: elEnd.value,
        notes: elNotes.value.trim(), color: current.color
      });
    }
    saveEvents();
    renderDay(current.month, current.day);
    resetForm();
    renderExisting(current.month, current.day);
  }

  function deleteEvent(id) {
    const key = keyFor(current.month, current.day);
    if (!events[key]) return;
    events[key] = events[key].filter(e => e.id !== id);
    if (!events[key].length) delete events[key];
    saveEvents();
    renderDay(current.month, current.day);
    renderExisting(current.month, current.day);
  }

  function closeModal() { overlay.classList.remove("open"); }

  document.getElementById("btn-save").addEventListener("click", saveFromForm);
  document.getElementById("btn-cancel").addEventListener("click", closeModal);
  overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
    if (e.key === "Enter" && overlay.classList.contains("open") &&
        document.activeElement === elTitle) saveFromForm();
  });

  /* ---------------- Export / Import / Clear ---------------- */
  document.getElementById("btn-export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ year: YEAR, events }, null, 2)],
                          { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "calendar-2027-schedule.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  const fileInput = document.getElementById("file-input");
  document.getElementById("btn-import").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const incoming = data.events || data; // accept raw map too
        if (typeof incoming !== "object") throw new Error("bad");
        // Clear current rendering
        document.querySelectorAll("td.has-events").forEach(td => {
          td.classList.remove("has-events");
          td.querySelector(".ev-dots").innerHTML = "";
          td.querySelectorAll(".ev-label").forEach(n => n.remove());
        });
        events = incoming;
        saveEvents();
        renderAll();
        alert("Schedule imported ✔");
      } catch (err) { alert("That file didn't look like a valid schedule export."); }
      fileInput.value = "";
    };
    reader.readAsText(file);
  });

  document.getElementById("btn-clear").addEventListener("click", () => {
    const total = Object.values(events).reduce((n, arr) => n + arr.length, 0);
    if (!total) { alert("There are no events to clear."); return; }
    if (!confirm(`Delete all ${total} event(s)? This cannot be undone (export first to keep a backup).`)) return;
    document.querySelectorAll("td.has-events").forEach(td => {
      td.classList.remove("has-events");
      td.querySelector(".ev-dots").innerHTML = "";
      td.querySelectorAll(".ev-label").forEach(n => n.remove());
    });
    events = {};
    saveEvents();
  });

  /* Season legend */
  const SEASONS = [
    { label:"Winter", color:"#2563eb" }, { label:"Spring", color:"#16a34a" },
    { label:"Summer", color:"#f59e0b" }, { label:"Autumn", color:"#ea580c" },
    { label:"Holiday", color:"#7c3aed" },
  ];
  const legend = document.getElementById("legend");
  SEASONS.forEach(s => {
    const span = document.createElement("span");
    span.innerHTML = `<i style="background:${s.color}"></i>${s.label}`;
    legend.appendChild(span);
  });

  /* Initial paint */
  renderAll();
</script>
</body>
</html>
